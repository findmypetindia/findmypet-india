<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | FindMyPet India</title>
  <meta name="theme-color" content="#2457f5">
  <meta name="description" content="Create a new password for your FindMyPet India account.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://findmypetindia.com/pages/reset-password.html">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=1">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="../css/login.css?v=606">
  <link rel="stylesheet" href="../css/footer.css">
  <style>
    .login-page { grid-template-columns: 1fr; }
    .right-section { grid-column: 1; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="login-page">
    <section class="right-section">
      <div class="login-box">
        <div class="mobile-logo">🐾 FindMyPet India</div>
        <h2>Reset your password</h2>
        <p class="subtitle">Choose a new password for your FindMyPet India account.</p>
        <form id="resetPasswordForm" autocomplete="on">
          <div class="input-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" name="newPassword" minlength="6" autocomplete="new-password" required>
          </div>
          <div class="input-group">
            <label for="confirmNewPassword">Confirm New Password</label>
            <input type="password" id="confirmNewPassword" name="confirmNewPassword" minlength="6" autocomplete="new-password" required>
          </div>
          <button class="login-button" id="resetPasswordButton" type="submit">Update Password</button>
          <p id="resetPasswordMessage" class="message" role="status" aria-live="polite"></p>
        </form>
        <a class="create-account-button" href="login.html">Back to Log In</a>
      </div>
    </section>
  </main>
  <div id="footer-container"></div>
  <script src="../js/supabase.js"></script>
  <script src="../js/reset-password.js?v=1"></script>
  <script src="../js/footer.js"></script>
</body>
</html>
